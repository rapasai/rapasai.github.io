<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="記事同士のつながりから、次に読む一冊を探せるRapasAI Labの蔵書ナビです。">
<title>AI・IT産業｜蔵書ナビ｜RapasAI Lab</title>
<link rel="stylesheet" href="./assets/library.css?v=20261028-2">
</head>
<body>
<header class="site-header"><div class="nav"><a class="brand" href="../" target="_blank" rel="noopener noreferrer"><img src="../assets/rapasai-logo-mark.png" alt=""><span>RapasAI Lab</span></a><div class="nav-note">蔵書ナビ</div></div></header>
<main class="page">
<section class="hero">
<div class="hero-kicker">LIBRARY MAP</div>
<h1>蔵書ナビ</h1>
<p class="lead">記事同士のつながりから、次に読む一冊を探せます。</p>
</section>
<section class="library-search" aria-labelledby="librarySearchTitle">
<div class="search-heading"><h2 id="librarySearchTitle">記事を探す</h2><span>記事タイトルやキーワードから、本棚とつながりを探せます</span></div>
<div class="search-box"><input id="librarySearchInput" type="search" placeholder="例：印西市 税収、排熱 水、Maia 300" autocomplete="off"><button id="librarySearchClear" class="search-clear" type="button" aria-label="検索をクリア">×</button></div>
<div class="search-status" id="searchStatus" aria-live="polite"></div>
<div class="search-results" id="searchResults"></div>
</section>
<section>
<div class="map-toolbar"><h2>AI・IT産業｜蔵書ナビ</h2><p>本棚をクリックすると、収録記事が表示されます。経路の説明をクリックすると、本棚同士のつながりを確認できます。</p></div>
<div class="map-shell">
<div class="map-scroll"><div class="map-canvas" id="mapCanvas">
<svg class="roads" id="roads" viewBox="0 0 1060 610" aria-hidden="true"></svg>
<div class="sign-popover" id="signPopover"></div>
</div></div>
</div>
</section>
<section class="shelf-view" id="shelfView" aria-live="polite">
<div class="shelf-head"><button class="back-map" id="backMap">← 蔵書ナビへ戻る</button><h2 id="shelfTitle"></h2><p id="shelfQuestion"></p></div>
<div class="book-grid" id="bookGrid"></div>
<div class="road-links"><h3>関連する本棚</h3><div class="road-link-list" id="roadLinkList"></div></div>
</section>
</main>
<footer class="footer">© RapasAI Lab</footer>
<script src="./assets/library.js?v=20261028-2"></script>
</body>
</html>
