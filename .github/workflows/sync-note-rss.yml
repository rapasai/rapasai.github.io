name: note記事情報を自動同期

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "articles.json"

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync-note:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: noteから記事情報を取得
        run: |
          python3 scripts/sync_note_rss.py --write

      - name: 変更内容を確認
        id: changes
        run: |
          if git diff --quiet -- articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: articles.jsonを自動更新
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles.json
          git commit -m "Sync note article metadata"
          git push
