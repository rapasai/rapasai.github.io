<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜RapasAI Lab</title><meta name="description" content="RapasAI Labへのテーマ提案、調査・記事作成に関するご相談はこちらから。">
<link rel="stylesheet" href="./assets/ask.css"></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="../index.html" aria-label="RapasAI Lab ホームへ戻る"><img src="./assets/rapasai-logo-mark.png" alt="" width="64" height="64"><span>RapasAI Lab</span></a><nav aria-label="ページナビゲーション"><a href="../index.html">ホームへ戻る <span aria-hidden="true">↗</span></a></nav></div></header>
<main class="page"><section class="intro" aria-labelledby="page-title"><p class="eyebrow">CONTACT</p><h1 id="page-title">お問い合わせ</h1><p class="lead">取り上げてほしいテーマや、調査・記事作成に関するご相談などがありましたら、下記フォームよりご連絡ください。</p></section>
<section class="form-surface" aria-label="お問い合わせフォーム"><form id="contact-form" action="https://formspree.io/f/mkjgrzpr" method="POST">
<input type="hidden" name="_subject" value="RapasAI Lab お問い合わせ">
<div class="honey" aria-hidden="true"><label for="site-check">入力しないでください</label><input type="text" id="site-check" name="_gotcha" tabindex="-1" autocomplete="off"></div>
<div class="field"><label for="inquiry_type">お問い合わせ種別 <span class="required">必須</span></label><select name="inquiry_type" id="inquiry_type" required><option value="">選択してください</option><option>取り上げてほしいテーマ</option><option>調査・記事作成のご相談</option><option>その他のお問い合わせ</option></select></div>
<div class="field"><label for="name">お名前 <span class="required">必須</span></label><input id="name" name="name" type="text" autocomplete="name" required placeholder="お名前・ニックネーム（本名でなくても構いません）"></div>
<div class="field"><label for="email">メールアドレス <span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" required placeholder="example@example.com"></div>
<div class="field"><label for="message">お問い合わせ内容 <span class="required">必須</span></label><textarea id="message" name="message" rows="7" required placeholder="ご相談の内容をご記入ください。"></textarea></div>
<div class="submit-row"><button id="submit-button" type="submit"><span id="submit-label">送信する</span><span class="submit-arrow" aria-hidden="true">→</span></button></div>
<p id="form-status" class="form-status" role="status" aria-live="polite" hidden></p>
</form><section id="success-panel" class="success-panel" tabindex="-1" aria-labelledby="success-heading" hidden><div class="success-mark" aria-hidden="true">✓</div><h2 id="success-heading">お問い合わせを受け付けました</h2><p>送信ありがとうございます。内容を確認のうえ、ご返信いたします。</p><a href="../index.html">ホームへ戻る →</a></section></section>
<section class="response" aria-labelledby="reply-title"><h2 id="reply-title">ご返信について</h2><p>いただいたお問い合わせは確認のうえ、通常24時間以内を目安にご返信いたします。</p><p>当方の業務と明らかに関係しない内容、迷惑行為に該当する内容、返信が困難な内容については、ご返信を控える場合があります。</p></section></main>
<footer class="site-footer"><div>© 2026 RapasAI Lab</div></footer><script src="./assets/ask.js" defer></script><script src="../assets/analytics.js"></script></body></html>
